[mgr]
show_hidden = false
ratio = [1, 2, 2]
sort_by = "mtime"

[opener]
text = [
  { run = 'zeditor -n %s', orphan = true, desc = "Zed", for = "unix" },
]
bulk-rename = [
  { run = 'zeditor -n --wait %s', block = true, desc = "Bulk rename with Zed", for = "unix" },
]
gimp = [
  { run = 'gimp %s', orphan = true, desc = "GIMP", for = "unix" },
]
image-viewer = [
  { run = 'imv %s', orphan = true, desc = "imv", for = "unix" },
]
obsidian = [
  { run = 'obsidian %s', orphan = true, desc = "Obsidian", for = "unix" },
]
pymol = [
  { run = 'pymol %s', orphan = true, desc = "PyMOL", for = "unix" },
]
okular = [
  { run = 'okular %s', orphan = true, desc = "Okular", for = "unix" },
]
zathura = [
  { run = 'zathura %s', orphan = true, desc = "Zathura", for = "unix" },
]
xournalpp = [
  { run = 'xournalpp %s', orphan = true, desc = "Xournal++", for = "unix" },
]
browser = [
  { run = 'brave --new-window %s', orphan = true, desc = "Brave", for = "unix" },
]
inkscape = [
  { run = 'inkscape %s', orphan = true, desc = "Inkscape", for = "unix" },
]
libreoffice = [
  { run = 'libreoffice %s', orphan = true, desc = "LibreOffice", for = "unix" },
]
unzip = [
  { run = 'unzip %s', desc = "Extract ZIP here", for = "unix" },
]
media-player = [
  { run = 'mpv -player-operation-mode=pseudo-gui %s', orphan = true, desc = "mpv", for = "unix" },
]
torrent-client = [
  { run = 'qbittorrent %s', orphan = true, desc = "qBittorrent", for = "unix" },
]
open = [
  { run = 'xdg-open %s', orphan = true, desc = "Default application", for = "unix" }
]

edit = [
  { run = 'zeditor -n %s', orphan = true, desc = "Zed", for = "unix" },
]
reveal = [
  { run = 'xdg-open %d1', orphan = true, desc = "Open containing folder", for = "unix" },
  { run = 'clear; exiftool %s1; echo "Press enter to exit"; read _', block = true, desc = "Show image metadata", for = "unix" },
]
play = [
  { run = 'xdg-open %s1', orphan = true, desc = "Default media player", for = "unix" },
  { run = 'mediainfo %s1; echo "Press enter to exit"; read _', block = true, desc = "Show media info", for = "unix" },
]
zip-folder = [
  { run = '''
for folder in %s; do
  (
    folder=${folder%/}
    if [ ! -d "$folder" ] || [ -z "$folder" ]; then
      echo "Not a folder: $folder" >&2
      exit 1
    fi
    parent=$(dirname -- "$folder")
    name=$(basename -- "$folder")
    cd -- "$parent" || exit 1
    archive="$PWD/$name.zip"
    number=2
    while [ -e "$archive" ] || [ -L "$archive" ]; do
      archive="$PWD/$name ($number).zip"
      number=$((number + 1))
    done
    zip -r -y "$archive" "./$name"
  ) || { echo "ZIP creation failed. Press enter to return to Yazi." >&2; read _; exit 1; }
done
''', block = true, desc = "Zip folder", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "folder/*", use = ["text", "open", "reveal", "zip-folder"] },
  # 1. High-priority intercepts
  { url = "*.md", use = ["text", "obsidian"] },

  # 2. Grouped Images (Kept individual rules to preserve custom choices)
  { url = "*.png", use = ["image-viewer", "gimp", "inkscape"] },
  { url = "*.svg", use = ["image-viewer", "gimp", "inkscape"] },
  { url = "*.jpg", use = ["image-viewer", "gimp"] },
  { url = "*.jpeg", use = ["image-viewer", "gimp"] },
  { url = "*.gif", use = ["image-viewer", "gimp"] },
  { url = "*.webp", use = ["image-viewer", "gimp"] },
  { url = "*.avif", use = ["image-viewer", "gimp"] },
  { url = "*.heic", use = ["image-viewer", "gimp"] },
  { url = "*.tif", use = ["image-viewer", "gimp"] },
  { url = "*.tiff", use = ["image-viewer", "gimp"] },
  { url = "*.bmp", use = ["image-viewer", "gimp"] },
  { url = "*.ico", use = ["image-viewer", "gimp"] },

  # 3. Media Catch-Alls (Replaces 14 individual extension lines)
  { mime = "video/*", use = "media-player" },
  { mime = "audio/*", use = "media-player" },

  # 4. Text Catch-All (Catches JSON, TOML, Nix, Py, Conf, Txt, etc.)
  { url = "*.html", use = "browser" },
  { url = "*.htm", use = "browser" },
  { url = "*.xhtml", use = "browser" },
  { url = "*.typ", use = "text" },
  { mime = "text/*", use = "text" },
  { url = "*.json", use = "text" }, # Extra fallback for environments where JSON lacks MIME headers
  { url = "*.jsonc", use = "text" },

  # 5. Specialized Formats
  { url = "*.pse", use = "pymol" },
  { url = "*.pdf", use = ["okular", "zathura"] },
  { url = "*.djvu", use = "okular" },
  { url = "*.xopp", use = "xournalpp" },
  { url = "*.pub", use = "text" },
  { url = "*.docx", use = "libreoffice" },
  { url = "*.xlsx", use = "libreoffice" },
  { url = "*.odt", use = "libreoffice" },
  { url = "*.ods", use = "libreoffice" },
  { url = "*.pptx", use = "libreoffice" },
  { url = "*.csv", use = ["text", "libreoffice"] },
  { url = "*.xcf", use = "gimp" },
  { url = "*.torrent", use = "torrent-client" },
  { url = "*.zip", use = "unzip" },

  # 6. Global Catch-All Fallback
  { url = "*", use = ["open", "browser", "text"] }
]
